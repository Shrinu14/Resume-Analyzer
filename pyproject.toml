
[project]
name = "resume-analyzer-backend"
version = "0.2.0"
description = "Enterprise-grade Resume Analyzer with JD matching, NLP, OCR, scoring, filtering, and LLM-based feedback."
authors = [
  { name = "Shrinivas V A", email = "shrinivasarenad727@gmail.com" }
]
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "spacy>=3.7.4",
  "pymongo>=4.6.3",
  "python-docx>=1.1.0",
  "pdfminer.six>=20231228",
  "pillow>=10.3.0",
  "pytesseract>=0.3.10",
  "sentence-transformers>=2.6.1",
  "scikit-learn>=1.4.2",
  "loguru>=0.7.2",
  "typer>=0.12.3",
  "python-multipart>=0.0.9",
  "langchain>=0.1.20",
  "langchain-core>=0.1.51",
  "langchain-community>=0.0.34",
  "langchain_ollama",
  "openai>=1.30.1",
  "tqdm>=4.66.4",
  "language-tool-python>=2.7.1",
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.1",
  "black>=24.4.2",
  "ruff>=0.4.4",
  "mypy>=1.10.0"
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W"]
exclude = ["tests/"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
strict = false

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
